name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: openharmony-zig/setup-zig-ohos@v0.1.0
        with:
          tag: '0.17.0'

      - name: Test host-side ownership and argument checks
        run: |
          zig test src/support/ffi.zig -lc
          zig test --dep opengtx --dep opengtx_sys -Mroot=tests/opengtx_test.zig --dep opengtx_sys --dep ohos_zig_binding_ffi -Mopengtx=src/opengtx/opengtx.zig -Mopengtx_sys=tests/mocks/opengtx.zig -Mohos_zig_binding_ffi=src/support/ffi.zig -lc

      - name: Check Zig syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            zig ast-check "$file"
          done < <(git ls-files -z '*.zig')
          while IFS= read -r -d '' file; do
            zig ast-check --zon "$file"
          done < <(git ls-files -z '*.zon')

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z '*.zig' '*.zon' | xargs -0 zig fmt
          git diff --exit-code

  ohos-build:
    runs-on: ubuntu-latest
    name: Build for OpenHarmony (${{ matrix.target }}, ${{ matrix.optimize }}, API ${{ matrix.api }})
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-ohos, arm-linux-ohoseabi, x86_64-linux-ohos]
        optimize: [debug, safe]
        api: [12, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenHarmony SDK
        uses: openharmony-rs/setup-ohos-sdk@v1.0.0
        with:
          version: '7.0'
          components: 'native'
          mirror: true

      - name: Setup Zig for OpenHarmony
        uses: openharmony-zig/setup-zig-ohos@v0.1.0
        with:
          tag: '0.17.0'

      - name: Validate OpenHarmony NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_home="${OHOS_NDK_HOME:-${OHOS_SDK_HOME:-}}"
          test -n "$sdk_home"
          test -d "$sdk_home/sysroot/usr/include" || test -d "$sdk_home/native/sysroot/usr/include"

      - name: Build root package
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=${{ matrix.optimize }} -Dapi=${{ matrix.api }} --summary all

      - name: Build root package with XComponent N-API integration
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=${{ matrix.optimize }} -Dapi=${{ matrix.api }} -Dxcomponent_napi=true --summary all

      - name: Build examples/basic
        working-directory: examples/basic
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=${{ matrix.optimize }} -Dapi=${{ matrix.api }} --summary all
